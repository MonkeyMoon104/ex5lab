name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e .
      - name: Smoke import and CLI version
        env:
          PYTHONPATH: src
        run: |
          python -c "from ex5lab import __version__; from ex5lab.decoder import DECODER_AVAILABLE; assert DECODER_AVAILABLE is False; print(__version__)"
          python -m ex5lab --version
